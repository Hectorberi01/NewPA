services:
  db:
    image: mysql:8.0
    container_name: mysql-sp
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: student_projects
      MYSQL_USER: sp
      MYSQL_PASSWORD: sp_password
    volumes:
      - db_data:/var/lib/mysql
    # expose si tu veux accéder depuis l'hôte; sinon enlève la section "ports"
    # ports:
    #   - "3307:3306"          # ← préfère 3307:3306 pour éviter le conflit sur 3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  api:
    build: .
    container_name: promotions-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: db                   # ← important : le nom du service MySQL
      DB_PORT: "3306"
      DB_USERNAME: sp
      DB_PASSWORD: sp_password
      DB_DATABASE: student_projects
      PORT: "4000"
    ports:
      - "4000:4000"
    volumes:
      - ./uploads:/app/uploads      # persister les fichiers uploadés
    networks: [backend]

networks:
  backend: {}

volumes:
  db_data: {}
