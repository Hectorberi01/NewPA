services:
  db:
    image: mysql:8.0
    platform: linux/arm64/v8
    container_name: mysql-sp
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: student_projects
      MYSQL_USER: sp
      MYSQL_PASSWORD: sp_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  api:
    build: .
    platform: linux/arm64/v8  # ← Au niveau du service, pas dans build
    container_name: promotions-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: "3306"
      DB_USERNAME: sp
      DB_PASSWORD: sp_password
      DB_DATABASE: student_projects
      PORT: "4000"
    ports:
      - "4000:4000"
    volumes:
      - ./uploads:/app/uploads
    networks: [backend]

networks:
  backend: {}

volumes:
  db_data: {}